name: CodeQL config
paths-ignore:
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/*.min.js"
  - "**/jquery/**"
  - "**/OwlCarousel*/**"
  - "**/owl carousel/**"
  - "**/docs/**"
  - "**/assets/js/old/**"
# .github/workflows/codeql.yml
- uses: github/codeql-action/init@v3
  with:
    languages: javascript-typescript
    config-file: ./.github/codeql/codeql-config.yml