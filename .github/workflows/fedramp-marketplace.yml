name: FedRAMP marketplace snapshot

# Downloads the FedRAMP Marketplace product export, keeps a dated snapshot when
# it changes, rebuilds /fedramp-20x-adoption/, /fedramp-lookup/ and the dated
# 20x carousel on fedramp.html, and redeploys the site.
#
# Manual fallback: export JSON from the marketplace yourself, commit it to
# data/fedramp/inbox/, and push. This workflow picks it up instead of the browser.

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 07:17 Eastern (11:17 UTC)
  workflow_dispatch:
  repository_dispatch:     # lets an API client with push access start a run:
    types: [marketplace-refresh]   #   POST /repos/khanssen/archstone/dispatches {"event_type":"marketplace-refresh"}
  push:
    branches: ["main"]
    paths:
      - "data/fedramp/inbox/**"
      - "data/fedramp/grc-vendors.json"
      - "data/fedramp/ai-vendors.json"
      - "data/fedramp/assessors.json"
      - "data/fedramp/usability-rules.json"
      - "data/fedramp/lookup-overrides.json"
      - "data/fedramp/hosted-services.json"
      - "scripts/fedramp/**"
      - "fedramp.html"
      - "index.html"   # the 20x page copies the homepage navigation

permissions:
  contents: write   # commit snapshots and the rebuilt page
  actions: write    # start the Pages deploy (pushes made with GITHUB_TOKEN don't trigger it)
  issues: write     # open an issue when the data behind the page changes

concurrency:
  group: fedramp-snapshot-2   # renamed Nov 12, 2026: run #75 is stuck in GitHub holding the old group
  cancel-in-progress: false

jobs:
  snapshot:
    # Pinned: ubuntu-latest moved to 26.04 on Nov 10, 2026 and Playwright can't install Chromium there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build from main as it is now, not the commit that triggered the run, so a queued run can't rebuild stale files.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          # Chromium comes from Playwright's CDN. Its system packages come from Ubuntu's apt mirror,
          # which the runner sometimes can't resolve (Nov 11, 2026); the 24.04 image already carries
          # what headless Chromium needs, so a failed apt step is a warning, not a stop.
          python -m playwright install chromium
          python -m playwright install-deps chromium || echo "::warning::Couldn't install Chromium's system packages; continuing with the runner image's."

      - name: Download marketplace export
        id: fetch
        continue-on-error: true
        run: python scripts/fedramp/fetch_marketplace.py --raw data/fedramp/raw --inbox data/fedramp/inbox

      - name: Record the raw export before anything can refuse it
        # The build steps below stop on exports they can't trust. The download itself is still the
        # dated record, so commit it first; a refused build must not cost a day of history.
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fedramp/raw
          if git diff --cached --quiet; then echo "Raw export already recorded."; exit 0; fi
          git commit -m "FedRAMP marketplace raw export $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the raw export after 3 attempts."
          exit 1

      - name: Record agency ATOs from FedRAMP's own data
        # Append-only ledger of every agency ATO any source has published (scripts/fedramp/build_ato_ledger.py).
        # Also keeps a dated copy of FedRAMP's ATO table whenever it changes, so the ledger's evidence
        # doesn't depend on FedRAMP's repository history. Runs before the build, which may refuse.
        id: ledger
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/FedRAMP/marketplace-fedramp-gov-data "$RUNNER_TEMP/fedramp-ato"
          git -C "$RUNNER_TEMP/fedramp-ato" sparse-checkout set --no-cone /data.json /fedramp-atos.json /fedramp-agencies.json /fedramp-status-changelog.json
          python scripts/fedramp/build_ato_ledger.py \
            --fr-dir "$RUNNER_TEMP/fedramp-ato" \
            --raw-dir data/fedramp/raw \
            --ledger data/fedramp/ato-ledger.json \
            --csv data/fedramp/ato-ledger.csv
          mkdir -p data/fedramp/raw-atos
          keep_if_changed() {   # $1 source file, $2 prefix in raw-atos/: keep a dated copy when its data changes
            local last; last=$(ls data/fedramp/raw-atos/$2-*.json.gz 2>/dev/null | sort | tail -n 1)
            python - "$1" "$last" "data/fedramp/raw-atos/$2-$(date -u +%Y-%m-%d).json.gz" <<'PY'
          import gzip, json, sys
          new = json.load(open(sys.argv[1]))
          if sys.argv[2]:
              old = json.load(gzip.open(sys.argv[2]))
              if old["data"] == new["data"]:
                  sys.exit(0)
          with gzip.open(sys.argv[3], "wt", encoding="utf-8") as fh:
              json.dump(new, fh, ensure_ascii=False)
          PY
          }
          keep_if_changed "$RUNNER_TEMP/fedramp-ato/fedramp-atos.json" fedramp-atos
          keep_if_changed "$RUNNER_TEMP/fedramp-ato/fedramp-status-changelog.json" fedramp-status-changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fedramp/ato-ledger.json data/fedramp/ato-ledger.csv data/fedramp/raw-atos
          if git diff --cached --quiet; then echo "ATO ledger unchanged."; exit 0; fi
          git commit -m "FedRAMP agency ATO ledger $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the ATO ledger after 3 attempts."
          exit 1

      - name: Check product pages of listings missing from the export
        # Evidence for the removals section: is the listing's own marketplace page still up?
        continue-on-error: true
        run: python scripts/fedramp/check_dropped.py --raw data/fedramp/raw --out data/fedramp/dropped-checks.json

      - name: Check the recognized-assessor list against FedRAMP's directory
        # Same list: moves "checked" in assessors.json to today. Different: leaves it and reports below.
        # If FedRAMP's repository can't be reached, nothing changes and the page keeps the last confirmed date.
        id: assessors
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/FedRAMP/marketplace-fedramp-gov-data "$RUNNER_TEMP/fedramp-data"
          git -C "$RUNNER_TEMP/fedramp-data" sparse-checkout set assessors
          python scripts/fedramp/check_assessors.py \
            --dir "$RUNNER_TEMP/fedramp-data/assessors" \
            --assessors data/fedramp/assessors.json \
            --today "$(date -u +%Y-%m-%d)" \
            --body "$RUNNER_TEMP/assessors.md"

      - name: Rebuild page from latest snapshot
        env:
          FETCHED: ${{ steps.fetch.outcome }}
        run: |
          SNAP=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          # Only claim today's check if today's download actually worked;
          # otherwise keep the last successful check date already on the page.
          if [ "$FETCHED" = "success" ]; then
            CHECKED=$(date -u +%Y-%m-%d)
          else
            CHECKED=$(grep -o 'data-checked="[0-9-]*"' fedramp-20x-adoption/index.html | head -1 | cut -d'"' -f2)
            CHECKED=${CHECKED:-$(basename "$SNAP" | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}')}
          fi
          python scripts/fedramp/build_page.py \
            --snapshot "$SNAP" \
            --grc data/fedramp/grc-vendors.json \
            --ai data/fedramp/ai-vendors.json \
            --nav-source index.html \
            --assessors data/fedramp/assessors.json \
            --out fedramp-20x-adoption \
            --history data/fedramp/history.csv \
            --raw-dir data/fedramp/raw \
            --legacy data/fedramp/legacy/rev5-legacy-2026-11-02.json \
            --ato-ledger data/fedramp/ato-ledger.json \
            --old-feed-20x data/fedramp/legacy/20x-old-feed-listings.json \
            --dropped-checks data/fedramp/dropped-checks.json \
            --feature-target fedramp.html \
            --checked "$CHECKED"

      - name: Rebuild the marketplace lookup
        run: |
          SNAP=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          STATUS_LOG=$(ls data/fedramp/raw-atos/fedramp-status-changelog-*.json.gz | sort | tail -n 1)
          gunzip -c "$STATUS_LOG" > "$RUNNER_TEMP/status-changelog.json"
          python scripts/fedramp/build_graph.py \
            --snapshot "$SNAP" \
            --hosted data/fedramp/hosted-services.json \
            --dependents data/fedramp/raw/products-2026-11-02.json.gz \
            --out data/fedramp/graph.json
          rm -rf fedramp-lookup/l
          python scripts/fedramp/build_history.py \
            --raw-dir data/fedramp/raw \
            --old-feed data/fedramp/legacy/old-feed-history.json.gz \
            --ledger data/fedramp/ato-ledger.json \
            --status-log "$RUNNER_TEMP/status-changelog.json" \
            --graph data/fedramp/graph.json \
            --out fedramp-lookup/l \
            --index data/fedramp/off-marketplace.json
          python scripts/fedramp/build_lookup.py \
            --snapshot "$SNAP" \
            --rules data/fedramp/usability-rules.json \
            --overrides data/fedramp/lookup-overrides.json \
            --hosted data/fedramp/hosted-services.json \
            --assessors data/fedramp/assessors.json \
            --nav-source index.html \
            --raw-dir data/fedramp/raw \
            --legacy data/fedramp/legacy/rev5-legacy-2026-11-02.json \
            --ato-ledger data/fedramp/ato-ledger.json \
            --history-index data/fedramp/off-marketplace.json \
            --out fedramp-lookup

      - name: Compare with the previous snapshot
        id: diff
        if: steps.fetch.outputs.changed == 'true'
        run: |
          PREV=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 2 | head -n 1)
          NEW=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          if [ "$PREV" = "$NEW" ]; then echo "First snapshot; nothing to compare."; exit 0; fi
          python scripts/fedramp/diff_snapshots.py \
            --old "$PREV" --new "$NEW" \
            --grc data/fedramp/grc-vendors.json \
            --history data/fedramp/history.csv \
            --assessors data/fedramp/assessors.json \
            --body "$RUNNER_TEMP/issue.md"

      - name: Look for new hosting platforms
        id: hosts
        if: steps.fetch.outputs.changed == 'true'
        run: |
          PREV=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 2 | head -n 1)
          NEW=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          if [ "$PREV" = "$NEW" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python scripts/fedramp/flag_hosts.py --old "$PREV" --new "$NEW" \
            --hosted data/fedramp/hosted-services.json --body "$RUNNER_TEMP/hosts.md"

      - name: Look for track changes
        id: tracks
        if: steps.fetch.outputs.changed == 'true'
        run: |
          PREV=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 2 | head -n 1)
          NEW=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          if [ "$PREV" = "$NEW" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python scripts/fedramp/track_changes.py --old "$PREV" --new "$NEW" --body "$RUNNER_TEMP/tracks.md"

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fedramp fedramp-20x-adoption fedramp-lookup fedramp.html
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
          else
            git commit -m "FedRAMP marketplace snapshot $(date -u +%Y-%m-%d)"
            # main may have moved since checkout (a merge or a push from VS Code
            # landing mid-run). Rebase onto it and retry rather than fail.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push rejected (attempt $attempt); rebasing onto origin/main."
              git pull --rebase origin main
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the snapshot after 3 attempts."
            exit 1
          fi

      - name: Deploy site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue for the change
        if: steps.diff.outputs.material == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.diff.outputs.title }}
          HEADLINE: ${{ steps.diff.outputs.headline }}
        run: |
          gh label create marketplace-update --color 1D76DB --description "FedRAMP marketplace data changed" 2>/dev/null || true
          gh label create headline-claim --color B60205 --description "A claim in the page's prose may no longer hold" 2>/dev/null || true
          LABELS=marketplace-update
          [ "$HEADLINE" = "true" ] && LABELS="$LABELS,headline-claim"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label "$LABELS"

      - name: Flag possible hosting platforms
        if: steps.hosts.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue at a time; later finds are added as comments.
          gh label create possible-host --color 6A4C93 --description "Listing may host other vendors' products" 2>/dev/null || true
          OPEN=$(gh issue list --label possible-host --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file "$RUNNER_TEMP/hosts.md"
          else
            gh issue create --label possible-host --title "Possible hosting platforms to review for /fedramp-lookup/" --body-file "$RUNNER_TEMP/hosts.md"
          fi

      - name: Report track changes
        if: steps.tracks.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue at a time; later changes are added as comments, so the history stays in one place.
          gh label create track-change --color B60205 --description "A listing changed track, path or class" 2>/dev/null || true
          OPEN=$(gh issue list --label track-change --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file "$RUNNER_TEMP/tracks.md"
          else
            gh issue create --label track-change --title "Marketplace listings changing track, path or class" --body-file "$RUNNER_TEMP/tracks.md"
          fi

      - name: Report assessor directory changes
        if: steps.assessors.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue at a time. Comment only when the difference itself changes, not every day it persists.
          gh label create assessor-directory --color 0E8A16 --description "FedRAMP's recognized-assessor list changed" 2>/dev/null || true
          OPEN=$(gh issue list --label assessor-directory --state open --json number --jq '.[0].number')
          if [ -z "$OPEN" ]; then
            gh issue create --label assessor-directory \
              --title "Recognized-assessor list out of date: update data/fedramp/assessors.json" \
              --body-file "$RUNNER_TEMP/assessors.md"
          else
            LAST=$(gh issue view "$OPEN" --json body,comments --jq '[.body] + [.comments[].body] | last')
            if [ "$LAST" != "$(cat "$RUNNER_TEMP/assessors.md")" ]; then
              gh issue comment "$OPEN" --body-file "$RUNNER_TEMP/assessors.md"
            fi
          fi

      - name: Warn if the assessor check couldn't run
        if: steps.assessors.outcome == 'failure'
        run: echo "::warning::Couldn't compare assessors.json with FedRAMP's directory today; the page keeps the last confirmed date."

      - name: Report a failed download
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per outage, with a comment per failed day, rather than a new issue every morning.
          gh label create marketplace-fetch-failed --color FBCA04 --description "Daily marketplace download failed" 2>/dev/null || true
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --label marketplace-fetch-failed --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Failed again $(date -u +%Y-%m-%d): $RUN"
          else
            gh issue create --label marketplace-fetch-failed \
              --title "Marketplace download failing — 20x page is serving the last good snapshot" \
              --body "The daily download failed $(date -u +%Y-%m-%d): $RUN. The page still shows the last snapshot, and its 'Last checked' date is frozen at the last successful download. Fix the fetcher, or export JSON by hand into data/fedramp/inbox/ and push."
          fi
          echo "::error::The marketplace export could not be downloaded. The page was rebuilt from the last snapshot. If this keeps failing, export JSON by hand and commit it to data/fedramp/inbox/."
          exit 1
