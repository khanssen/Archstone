name: FedRAMP marketplace snapshot

# Downloads the FedRAMP Marketplace product export, keeps a dated snapshot when
# it changes, rebuilds /fedramp-20x-adoption/, /fedramp-lookup/ and the dated
# 20x carousel on fedramp.html, and redeploys the site.
#
# Manual fallback: export JSON from the marketplace yourself, commit it to
# data/fedramp/inbox/, and push. This workflow picks it up instead of the browser.

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 07:17 Eastern (11:17 UTC)
  workflow_dispatch:
  repository_dispatch:     # lets an API client with push access start a run:
    types: [marketplace-refresh]   #   POST /repos/khanssen/archstone/dispatches {"event_type":"marketplace-refresh"}
  push:
    branches: ["main"]
    paths:
      - "data/fedramp/inbox/**"
      - "data/fedramp/grc-vendors.json"
      - "data/fedramp/ai-vendors.json"
      - "data/fedramp/assessors.json"
      - "data/fedramp/usability-rules.json"
      - "data/fedramp/lookup-overrides.json"
      - "data/fedramp/hosted-services.json"
      - "scripts/fedramp/**"
      - "fedramp.html"
      - "index.html"   # the 20x page copies the homepage navigation

permissions:
  contents: write   # commit snapshots and the rebuilt page
  actions: write    # start the Pages deploy (pushes made with GITHUB_TOKEN don't trigger it)
  issues: write     # open an issue when the data behind the page changes

concurrency:
  group: fedramp-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build from main as it is now, not the commit that triggered the run, so a queued run can't rebuild stale files.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Download marketplace export
        id: fetch
        continue-on-error: true
        run: python scripts/fedramp/fetch_marketplace.py --raw data/fedramp/raw --inbox data/fedramp/inbox

      - name: Check product pages of listings missing from the export
        # Evidence for the removals section: is the listing's own marketplace page still up?
        continue-on-error: true
        run: python scripts/fedramp/check_dropped.py --raw data/fedramp/raw --out data/fedramp/dropped-checks.json

      - name: Rebuild page from latest snapshot
        env:
          FETCHED: ${{ steps.fetch.outcome }}
        run: |
          SNAP=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          # Only claim today's check if today's download actually worked;
          # otherwise keep the last successful check date already on the page.
          if [ "$FETCHED" = "success" ]; then
            CHECKED=$(date -u +%Y-%m-%d)
          else
            CHECKED=$(grep -o 'data-checked="[0-9-]*"' fedramp-20x-adoption/index.html | head -1 | cut -d'"' -f2)
            CHECKED=${CHECKED:-$(basename "$SNAP" | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}')}
          fi
          python scripts/fedramp/build_page.py \
            --snapshot "$SNAP" \
            --grc data/fedramp/grc-vendors.json \
            --ai data/fedramp/ai-vendors.json \
            --nav-source index.html \
            --assessors data/fedramp/assessors.json \
            --out fedramp-20x-adoption \
            --history data/fedramp/history.csv \
            --raw-dir data/fedramp/raw \
            --dropped-checks data/fedramp/dropped-checks.json \
            --feature-target fedramp.html \
            --checked "$CHECKED"

      - name: Rebuild the marketplace lookup
        run: |
          SNAP=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          python scripts/fedramp/build_lookup.py \
            --snapshot "$SNAP" \
            --rules data/fedramp/usability-rules.json \
            --overrides data/fedramp/lookup-overrides.json \
            --hosted data/fedramp/hosted-services.json \
            --assessors data/fedramp/assessors.json \
            --nav-source index.html \
            --out fedramp-lookup

      - name: Compare with the previous snapshot
        id: diff
        if: steps.fetch.outputs.changed == 'true'
        run: |
          PREV=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 2 | head -n 1)
          NEW=$(ls data/fedramp/raw/products-*.json.gz | sort | tail -n 1)
          if [ "$PREV" = "$NEW" ]; then echo "First snapshot; nothing to compare."; exit 0; fi
          python scripts/fedramp/diff_snapshots.py \
            --old "$PREV" --new "$NEW" \
            --grc data/fedramp/grc-vendors.json \
            --history data/fedramp/history.csv \
            --assessors data/fedramp/assessors.json \
            --body "$RUNNER_TEMP/issue.md"

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fedramp fedramp-20x-adoption fedramp-lookup fedramp.html
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
          else
            git commit -m "FedRAMP marketplace snapshot $(date -u +%Y-%m-%d)"
            # main may have moved since checkout (a merge or a push from VS Code
            # landing mid-run). Rebase onto it and retry rather than fail.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push rejected (attempt $attempt); rebasing onto origin/main."
              git pull --rebase origin main
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the snapshot after 3 attempts."
            exit 1
          fi

      - name: Deploy site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue for the change
        if: steps.diff.outputs.material == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.diff.outputs.title }}
          HEADLINE: ${{ steps.diff.outputs.headline }}
        run: |
          gh label create marketplace-update --color 1D76DB --description "FedRAMP marketplace data changed" 2>/dev/null || true
          gh label create headline-claim --color B60205 --description "A claim in the page's prose may no longer hold" 2>/dev/null || true
          LABELS=marketplace-update
          [ "$HEADLINE" = "true" ] && LABELS="$LABELS,headline-claim"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label "$LABELS"

      - name: Report a failed download
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per outage, with a comment per failed day, rather than a new issue every morning.
          gh label create marketplace-fetch-failed --color FBCA04 --description "Daily marketplace download failed" 2>/dev/null || true
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --label marketplace-fetch-failed --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Failed again $(date -u +%Y-%m-%d): $RUN"
          else
            gh issue create --label marketplace-fetch-failed \
              --title "Marketplace download failing — 20x page is serving the last good snapshot" \
              --body "The daily download failed $(date -u +%Y-%m-%d): $RUN. The page still shows the last snapshot, and its 'Last checked' date is frozen at the last successful download. Fix the fetcher, or export JSON by hand into data/fedramp/inbox/ and push."
          fi
          echo "::error::The marketplace export could not be downloaded. The page was rebuilt from the last snapshot. If this keeps failing, export JSON by hand and commit it to data/fedramp/inbox/."
          exit 1
