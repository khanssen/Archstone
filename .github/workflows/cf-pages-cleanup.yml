name: Cloudflare Pages cleanup (one-off)

# Deletes the stale archstone.pages.dev project (too many deployments for the
# dashboard). Trigger with repository_dispatch type cf-pages-cleanup and
# client_payload {"mode": "inspect"|"delete"}, or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect (list only) or delete
        default: inspect
      account_id:
        description: Cloudflare account ID
        required: false
  repository_dispatch:
    types: [cf-pages-cleanup]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || github.event.client_payload.account_id || github.event.inputs.account_id }}
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'inspect' }}
        run: |
          set +e
          out=$(python3 scripts/cloudflare/pages_cleanup.py archstone "$MODE" 2>&1); rc=$?
          echo "$out"
          # also as an annotation, so the result is readable from the run page and the API
          out="${out//'%'/'%25'}"; echo "::notice title=pages cleanup (exit $rc)::${out//$'\n'/%0A}"
          exit $rc
