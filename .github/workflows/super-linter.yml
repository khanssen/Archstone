name: Lint Code Base

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'images/**'
      - 'font/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.woff*'
      - '**/*.ttf'
      - 'CNAME'
      - '.nojekyll'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'images/**'
      - 'font/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.woff*'
      - '**/*.ttf'
      - 'CNAME'
      - '.nojekyll'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # if you don't want lint to block deploys, keep this true
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Super-Linter
        uses: github/super-linter/slim@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          IGNORE_GITIGNORED_FILES: true
          # enable/disable as you like:
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          # keep your prior exclusion for _headers
          FILTER_REGEX_EXCLUDE: _headers.*
