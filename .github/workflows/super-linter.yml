name: Super Linter
permissions:
  contents: read
  statuses: write  # allow Super Linter to post commit statuses

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for JS linters)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Super Linter
        uses: github/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Point Super Linter/ESLint at your flat config
          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.cjs

          # Enable linters you want
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_ES: true
          # VALIDATE_HTML: true
          # VALIDATE_CSS: true

          # Optional: clearer logs
          OUTPUT_DETAILS: detailed
          LOG_LEVEL: NOTICE
