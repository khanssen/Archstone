name: Super Duper Linter Splinter

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # --- Job 1: JS/TS lint (ESLint flat config) ---
  lint-js:
    name: Splinter JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Super Linter (JS/TS)
        uses: super-linter/super-linter@v7.4.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ESLint flat config
          ESLINT_USE_FLAT_CONFIG: true
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          LINTER_RULES_PATH: .

          # Lint scope
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true  # if TS handled by ESLint

          # Output & summaries
          OUTPUT_DETAILS: detailed
          LOG_LEVEL: DEBUG
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          SAVE_SUPER_LINTER_SUMMARY: true

          # Exclusions
          FILTER_REGEX_EXCLUDE: "(^|/)(node_modules|dist|build|coverage|vendor)/|(^|/)(HTML[ _-]?Template|Content[ _/-]?.*/documentation|documentation)/|(^|/)(owl[ _-]?carousel)/|(^|/)(gulpfile\\.js)|(^|/)js/.*\\.min\\.js$|(^|/)Content/HTML[ _-]?Template/.*|(^|/)owl[ _-]?carousel/.*|(^|/)documentation/.*|(^|/)HTML[ _-]?Template/.*|\\.min\\.js$"

  # --- Job 2: YAML/Markdown/JSON lint ---
  lint-meta:
    name: 📜 Splinter Scroll Sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Super Linter (Meta)
        uses: super-linter/super-linter@v7.4.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JSON: true
          # Optional extras:
          # VALIDATE_HTML: true
          # VALIDATE_CSS: true

          OUTPUT_DETAILS: detailed
          LOG_LEVEL: NOTICE
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          SAVE_SUPER_LINTER_SUMMARY: true

          FILTER_REGEX_EXCLUDE: "(^|/)(node_modules|dist|build|coverage|vendor)/"
