name: Super Linter
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for JS linters)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Super Linter
        uses: github/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.cjs

          # 🔽 Exclude all the junk files and vendor code
          FILTER_REGEX_EXCLUDE: >
            (^|/)(node_modules|dist|build|coverage|vendor)/
            | (^|/)(HTML Template|Content/.*/documentation|documentation)/
            | (^|/)owl carousel/
            | \.min\.js$

          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_ES: true
          OUTPUT_DETAILS: detailed
          LOG_LEVEL: NOTICE
