name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only runs if you actually have a package.json at repo root
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install (if package.json exists)
        if: hashFiles('package.json') != ''
        run: npm ci

      # Basic HTML build/smoke test: ensure the index exists
      - name: Verify site entrypoint
        run: |
          test -f index.html || (echo "index.html not found at repo root" && exit 1)

