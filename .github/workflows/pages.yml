name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If you have a build step (npm), keep these; otherwise they no-op.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install deps
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build (optional)
        if: hashFiles('package.json') != '' && hashFiles('package.json', 'package-lock.json') != ''
        run: |
          # replace with your actual build, or leave as a no-op
          echo "No build step defined; skipping"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your site files are at the repo root, use '.'
          # If they live in a subfolder (e.g., 'dist' or 'docs'), change this.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
