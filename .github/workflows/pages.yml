@'
name: pages build and deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: list site tree
        run: |
          pwd
          echo "---- top-level ----"
          ls -la
          echo "---- find ./font ----"
          find . -type d -name font -print -exec ls -la {} \; || true
          echo "---- show ./font ----"
          ls -la ./font || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
'@ | Set-Content .github\workflows\pages.yml -NoNewline -Encoding UTF8
