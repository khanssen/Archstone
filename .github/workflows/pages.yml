name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A queued or duplicate push event can carry an older commit; always deploy what main is now.
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Assemble public site (repo minus .deployignore)
        run: |
          mkdir _site
          rsync -a --exclude-from=.deployignore ./ _site/
          echo "Publishing $(find _site -type f | wc -l) files"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
